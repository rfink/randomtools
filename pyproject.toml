[build-system]
requires = ["setuptools>=45"]
build-backend = "setuptools.build_meta"

[project]
name = "randomtools"
version = "0.1.0"
requires-python = ">=3.8"
license = "GPL-3.0-only"
dependencies = [
    "bitarray",
]

[tool.setuptools.packages.find]
include = ["randomtools*"]

[tool.setuptools.package-data]
randomtools = ["*.yaml", "*.txt"]
